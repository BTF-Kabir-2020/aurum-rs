[package]
name = "aurum-rs"
version = "0.1.0"
edition = "2024"
description = "High-performance financial market intelligence engine built in Rust"
license = "MIT"
repository = "https://github.com/BTF-Kabir-2020/aurum-rs"
keywords = ["trading", "indicators", "market-data", "cli", "rust"]
categories = ["command-line-utilities", "finance", "science", "asynchronous"]
rust-version = "1.98.1"

[[bin]]
name = "aurum"
path = "src/main.rs"

[lib]
name = "aurum"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.6", features = ["parse"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
