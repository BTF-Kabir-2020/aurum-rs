name: aurum

services:
  aurum:
    build: .
    image: aurum/aurum-rs:0.1.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AURUM_CONFIG: config.toml
      AURUM_DB_PATH: /data/aurum.db
      AURUM_SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s